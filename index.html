<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">

<!-- ===================================================================
     ▼ 設定：ここだけ編集すればOKです
     =================================================================== -->
<script>
  // 実際のメンバーはNotionの「演出リンク」から ?members= で渡します。
  // ここはパラメータなしで開いたときのデモ用。氏名は書かないでください
  // （このファイルは公開リポジトリに置かれます）。
  const MEMBERS = [
    "Aさん",
    "Bさん",
    "Cさん",
    "Dさん",
    "Eさん",
  ];

  // 過去に当たった人を除外する: true / 毎回全員から抽選: false
  const EXCLUDE_PAST_WINNERS = true;

  // 除外する履歴の数。0 = 全履歴（全員一巡するまで当たらない）
  // 2 にすると「前回・前々回の2人だけ除外」になります
  const EXCLUDE_COUNT = 0;
</script>
<!-- =================================================================== -->

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>次回司会ルーレット</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1f2328;
    --muted: #6b7280;
    --line: #e5e7eb;
    --chip: #f3f4f6;
    --accent: #2f6feb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #191919;
      --fg: #e8e8e6;
      --muted: #9b9b98;
      --line: #373737;
      --chip: #2a2a2a;
      --accent: #5b8def;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans",
                 "Noto Sans JP", "Yu Gothic UI", sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 20px 16px;
  }
  .stage { position: relative; line-height: 0; }
  canvas { max-width: 100%; height: auto; }
  .pointer {
    position: absolute;
    top: -2px;
    left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 13px solid transparent;
    border-right: 13px solid transparent;
    border-top: 22px solid var(--fg);
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.35));
  }
  .result {
    font-size: 26px;
    font-weight: 700;
    min-height: 52px;
    text-align: center;
    letter-spacing: .02em;
  }
  .result .label { font-size: 13px; font-weight: 500; color: var(--muted); }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
  button {
    font: inherit;
    cursor: pointer;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--fg);
    padding: 9px 16px;
    transition: opacity .15s;
  }
  button:hover:not(:disabled) { opacity: .7; }
  button:disabled { opacity: .4; cursor: default; }
  #spin {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 700;
    padding: 11px 32px;
  }
  #reset.armed {
    background: #d93025;
    border-color: #d93025;
    color: #fff;
    font-weight: 700;
  }
  .note { font-size: 12px; color: var(--muted); text-align: center; }
  .note.round { color: var(--accent); font-weight: 600; }
  .history {
    width: 100%;
    max-width: 420px;
    border-top: 1px solid var(--line);
    padding-top: 10px;
    margin-top: 2px;
  }
  .history h2 {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    margin: 0 0 7px;
    letter-spacing: .06em;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip {
    font-size: 12px;
    background: var(--chip);
    border-radius: 999px;
    padding: 3px 10px;
    color: var(--muted);
  }
  .chip.newest { background: var(--accent); color: #fff; font-weight: 600; }
  .chip.empty { background: transparent; padding-left: 0; }
</style>
</head>
<body>

<div class="stage">
  <canvas id="wheel" width="680" height="680" style="width:340px;height:340px"></canvas>
  <div class="pointer"></div>
</div>

<div class="result" id="result"></div>

<div class="controls">
  <button id="spin">まわす</button>
  <button id="undo">1つ取り消す</button>
  <button id="reset">履歴をリセット</button>
</div>

<div class="note" id="note"></div>

<div class="history">
  <h2>司会の履歴（左が最新）</h2>
  <div class="chips" id="chips"></div>
</div>

<script>
(() => {
  "use strict";

  const STORE_KEY = "next-facilitator-roulette:history:v2";
  const COLORS = [
    "#4C78A8", "#F58518", "#54A24B", "#E45756", "#72B7B2",
    "#B279A2", "#EECA3B", "#9D755D", "#FF9DA6", "#79706E",
  ];

  const canvas   = document.getElementById("wheel");
  const ctx      = canvas.getContext("2d");
  const resultEl = document.getElementById("result");
  const noteEl   = document.getElementById("note");
  const chipsEl  = document.getElementById("chips");
  const spinBtn  = document.getElementById("spin");
  const undoBtn  = document.getElementById("undo");
  const resetBtn = document.getElementById("reset");

  const DPR = canvas.width / parseFloat(canvas.style.width);
  const CX = canvas.width / 2, CY = canvas.height / 2;
  const R  = CX - 10 * DPR;

  // ---- URLパラメータ（Notion連携モード）--------------------------------
  //   ?winner=Bさん        Notionが決めた当選者。必ずこの人で止まる
  //   ?history=Bさん,Aさん 除外する履歴（カンマ区切り、左が最新）
  //   ?members=A,B,C      メンバーの上書き（省略時はファイル冒頭の MEMBERS）
  // winner がある＝Notionが抽選済み。HTMLは演出に徹し、履歴も保存しない。
  // パラメータなしで開けば、これまで通りHTML単独で抽選します。
  const params  = new URLSearchParams(location.search);
  const toList  = s => (s || "").split(",").map(v => v.trim()).filter(Boolean);
  const qWinner = (params.get("winner") || "").trim();
  const qMembers = toList(params.get("members"));
  const roster  = qMembers.length ? qMembers : MEMBERS;
  const LINKED  = qWinner !== "";
  // Notionの履歴は当選者を先頭に含むので、盤面を作る前に当選者を取り除く
  const qHistory = toList(params.get("history")).filter(n => n !== qWinner);

  // file:// や プライベートモードで localStorage が使えない場合のフォールバック
  const store = (() => {
    try {
      const k = "__probe__";
      localStorage.setItem(k, "1");
      localStorage.removeItem(k);
      return localStorage;
    } catch {
      const mem = new Map();
      return {
        getItem: k => (mem.has(k) ? mem.get(k) : null),
        setItem: (k, v) => mem.set(k, String(v)),
        removeItem: k => mem.delete(k),
      };
    }
  })();

  // history[0] が最新
  let history = LINKED ? qHistory.slice() : loadHistory();
  let candidates = [];
  let rotation = 0;
  let spinning = false;
  let roundMsg = "";
  let pendingRefresh = null;

  function loadHistory() {
    try {
      const raw = JSON.parse(store.getItem(STORE_KEY) || "[]");
      // メンバーから消えた人は履歴からも落とす
      return Array.isArray(raw) ? raw.filter(n => roster.includes(n)) : [];
    } catch {
      return [];
    }
  }

  function saveHistory() {
    if (LINKED) return;   // 正はNotion側。ブラウザには残さない
    store.setItem(STORE_KEY, JSON.stringify(history));
  }

  // 除外対象（連携モードはNotionから渡された履歴をそのまま使う）
  function excluded() {
    if (LINKED) return history.slice();
    if (!EXCLUDE_PAST_WINNERS) return [];
    return EXCLUDE_COUNT > 0 ? history.slice(0, EXCLUDE_COUNT) : history.slice();
  }

  /**
   * 履歴から抽選対象を組み直す。
   * 単独モードで全員除外されたら一巡完了とみなし、履歴をリセットして次の一巡へ。
   */
  function rebuild() {
    const skip = new Set(excluded());
    let pool = roster.filter(m => !skip.has(m));

    if (LINKED) {
      // 当選者が盤面にいないと止まれないので必ず残す
      if (!pool.includes(qWinner)) pool = pool.concat([qWinner]);
    } else if (pool.length === 0) {
      history = [];
      saveHistory();
      pool = roster.slice();
      roundMsg = "全員が一巡しました。履歴をリセットして新しい一巡を開始します。";
    }

    candidates = pool;
    // 1人目のセグメントが真上に来る向きに戻す
    rotation = -Math.PI / 2 - Math.PI / candidates.length;
  }

  function draw() {
    const n = candidates.length;
    const seg = (Math.PI * 2) / n;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.translate(CX, CY);
    ctx.rotate(rotation);

    for (let i = 0; i < n; i++) {
      const a0 = i * seg;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, R, a0, a0 + seg);
      ctx.closePath();
      ctx.fillStyle = COLORS[i % COLORS.length];
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,.85)";
      ctx.lineWidth = 2 * DPR;
      ctx.stroke();

      ctx.save();
      ctx.rotate(a0 + seg / 2);
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#fff";
      const size = Math.min(22, 120 / Math.max(1, candidates[i].length) + 10) * DPR;
      ctx.font = `700 ${size}px -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif`;
      ctx.shadowColor = "rgba(0,0,0,.35)";
      ctx.shadowBlur = 3 * DPR;
      ctx.fillText(candidates[i], R - 16 * DPR, 0);
      ctx.restore();
    }

    ctx.beginPath();
    ctx.arc(0, 0, 26 * DPR, 0, Math.PI * 2);
    ctx.fillStyle = getComputedStyle(document.body).backgroundColor;
    ctx.fill();
    ctx.lineWidth = 3 * DPR;
    ctx.strokeStyle = "rgba(128,128,128,.5)";
    ctx.stroke();
    ctx.restore();
  }

  function renderSidebar() {
    chipsEl.innerHTML = "";
    if (history.length === 0) {
      const d = document.createElement("span");
      d.className = "chip empty";
      d.textContent = "まだありません";
      chipsEl.appendChild(d);
    } else {
      history.forEach((name, i) => {
        const d = document.createElement("span");
        d.className = "chip" + (i === 0 ? " newest" : "");
        d.textContent = name;
        chipsEl.appendChild(d);
      });
    }

    // 連携モードでは履歴の正はNotion側なので、編集ボタンは出さない
    undoBtn.hidden = resetBtn.hidden = LINKED;
    undoBtn.disabled = spinning || history.length === 0;
    resetBtn.disabled = spinning || history.length === 0;

    const skipCount = excluded().length;
    if (roundMsg) {
      noteEl.className = "note round";
      noteEl.textContent = roundMsg;
    } else if (LINKED) {
      noteEl.className = "note";
      noteEl.textContent =
        `Notionの履歴で動作中 ／ 対象 ${candidates.length} 名 ／ 除外 ${skipCount} 名`;
    } else {
      noteEl.className = "note";
      noteEl.textContent = skipCount
        ? `対象 ${candidates.length} 名 ／ 除外 ${skipCount} 名（ルーレット非表示）`
        : `対象 ${candidates.length} 名`;
    }
  }

  /** 盤面と履歴表示をいまの状態に合わせる */
  function refresh() {
    if (pendingRefresh) { clearTimeout(pendingRefresh); pendingRefresh = null; }
    disarmReset();
    rebuild();
    draw();
    renderSidebar();
  }

  function spin() {
    if (spinning) return;

    // ここで必ず組み直す（直前の当選者を盤面から外してから回す）
    roundMsg = "";
    refresh();

    spinning = true;
    spinBtn.disabled = undoBtn.disabled = resetBtn.disabled = true;
    resultEl.textContent = "";

    const n = candidates.length;
    const seg = (Math.PI * 2) / n;
    // 連携モードはNotionが決めた人で止める。単独モードはここで抽選する
    const winnerIdx = LINKED
      ? Math.max(0, candidates.indexOf(qWinner))
      : Math.floor(Math.random() * n);
    const winner = candidates[winnerIdx];

    const turns = 5 + Math.floor(Math.random() * 3);
    const from = rotation % (Math.PI * 2);
    // 当たりセグメントの中心が真上（-90°）に来る回転量
    const target = -Math.PI / 2 - (winnerIdx + 0.5) * seg + Math.PI * 2 * turns;
    const delta = target - from;
    const dur = 4200;
    const t0 = performance.now();
    rotation = from;

    function frame(now) {
      const t = Math.min(1, (now - t0) / dur);
      rotation = from + delta * (1 - Math.pow(1 - t, 4)); // ease-out quart
      draw();
      if (t < 1) { requestAnimationFrame(frame); return; }

      history.unshift(winner);
      saveHistory();

      resultEl.innerHTML = `<div class="label">次回の司会は</div>${winner}&nbsp;さん`;
      spinning = false;
      spinBtn.disabled = false;
      renderSidebar();

      // 当選位置を少し見せてから、当選者を外した盤面に差し替える
      // 連携モードは結果を確定表示にしたいので差し替えない
      if (!LINKED) {
        pendingRefresh = setTimeout(() => { pendingRefresh = null; refresh(); }, 1400);
      }
    }
    requestAnimationFrame(frame);
  }

  spinBtn.addEventListener("click", spin);

  undoBtn.addEventListener("click", () => {
    if (spinning || history.length === 0) return;
    const removed = history.shift();
    saveHistory();
    roundMsg = `「${removed}」を履歴から取り消しました。`;
    refresh();
    resultEl.textContent = "";
  });

  // Notionの埋め込みiframeは sandbox に allow-modals が無く confirm() が
  // 握り潰されるため、ダイアログを使わず「2回クリックで確定」方式にする
  let resetArmed = false;
  let resetTimer = null;

  function disarmReset() {
    resetArmed = false;
    if (resetTimer) { clearTimeout(resetTimer); resetTimer = null; }
    resetBtn.textContent = "履歴をリセット";
    resetBtn.classList.remove("armed");
  }

  resetBtn.addEventListener("click", () => {
    if (spinning || history.length === 0) return;

    if (!resetArmed) {
      resetArmed = true;
      resetBtn.textContent = "本当に消す？（もう一度）";
      resetBtn.classList.add("armed");
      resetTimer = setTimeout(disarmReset, 5000);   // 放置したら自動で元に戻す
      return;
    }

    disarmReset();
    history = [];
    saveHistory();
    roundMsg = "履歴をリセットしました。全員が抽選対象に戻ります。";
    refresh();
    resultEl.textContent = "";
  });

  refresh();
})();
</script>
</body>
</html>
